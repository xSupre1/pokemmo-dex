<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO Dex Optimizer</title>
    <!-- Enlace para hacer la app instalable en móviles -->
    <link rel="manifest" href="manifest.json">
    <!-- Versión estable de Tailwind CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #030712; color: #f3f4f6; }
        .bg-gray-900 { background-color: #111827; }
        .border-gray-800 { border-color: #1f2937; }
        .pokemon-card.captured {
            opacity: 0.30;
            filter: grayscale(90%);
        }
    </style>
</head>
<body class="min-h-screen font-sans">

    <!-- Encabezado -->
    <header class="border-b border-gray-800 bg-gray-900 px-4 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-black tracking-wider uppercase text-red-500">
                    PokeMMO Dex Tracker
                </h1>
            </div>
            <div class="text-sm font-semibold text-gray-400">
                Progreso Total: <span id="global-progress" class="text-green-400 font-bold">0/0</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controles Izquierda -->
        <section class="lg:col-span-1 space-y-4">
            <!-- Regiones -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">📍 Seleccionar Región</h2>
                <div class="grid grid-cols-2 gap-2" id="region-buttons"></div>
            </div>

            <!-- Buscador -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">🔍 Buscar Pokémon</h2>
                <input type="text" id="search-bar" placeholder="Escribe el nombre..." 
                       class="w-full bg-black border border-gray-800 rounded-lg px-3 py-2 text-white placeholder-gray-600 focus:outline-none focus:border-red-500">
            </div>

            <!-- Optimizador -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl">
                <h2 class="text-sm font-bold uppercase tracking-wider text-yellow-400 mb-2">🎯 Ruta más Eficiente</h2>
                <p class="text-xs text-gray-400 mb-3">Calcula el mapa donde te faltan más capturas en la región activa.</p>
                <button id="btn-calc-route" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow transition-all uppercase tracking-wider text-xs cursor-pointer">
                    ⚡ Calcular Mejor Ruta
                </button>
                <div id="route-result" class="mt-3 p-3 bg-black border border-gray-800 rounded-lg hidden text-xs space-y-1"></div>
            </div>
        </section>

        <!-- Lista Derecha -->
        <section class="lg:col-span-2 space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                <h2 class="text-md font-bold uppercase text-gray-200" id="active-region-title">Kanto</h2>
                <span class="text-xs font-medium text-gray-400 bg-black border border-gray-800 px-3 py-1 rounded-full" id="region-count">0 restantes</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="pokemon-grid"></div>
        </section>

    </main>
