<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMMO Dex Optimizer</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        .pokemon-card.captured {
            opacity: 0.35;
            filter: grayscale(80%);
            border-color: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans selection:bg-red-500 selection:text-white">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50 px-4 py-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-4 h-4 bg-red-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-amber-400">
                    PokeMMO Dex Tracker
                </h1>
            </div>
            <div class="flex gap-4 text-sm font-semibold text-gray-400">
                <div>Progreso Total: <span id="global-progress" class="text-emerald-400 font-bold">0/0</span></div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">📍 Seleccionar Región</h2>
                <div class="grid grid-cols-2 gap-2" id="region-buttons"></div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-3">🔍 Buscar Pokémon</h2>
                <input type="text" id="search-bar" placeholder="Escribe el nombre del pokémon..." 
                       class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-red-500 transition-colors">
            </div>

            <div class="bg-gradient-to-br from-gray-900 to-gray-950 border border-gray-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-8 -bottom-8 w-24 h-24 bg-red-500/10 rounded-full blur-xl"></div>
                <h2 class="text-base font-extrabold uppercase tracking-wider text-amber-400 mb-2 flex items-center gap-2">
                    🎯 Ruta más Eficiente
                </h2>
                <p class="text-xs text-gray-400 mb-4">Calcula automáticamente el mapa donde te faltan más capturas en la región activa.</p>
                
                <button id="btn-calc-route" class="w-full bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-gray-950 font-black py-3 rounded-xl shadow-lg shadow-red-500/10 transition-transform active:scale-[0.98] uppercase tracking-wider text-sm cursor-pointer">
                    ⚡ Calcular Mejor Ruta
                </button>

                <div id="route-result" class="mt-4 p-4 bg-gray-950/60 border border-gray-800 rounded-xl hidden space-y-2"></div>
            </div>
        </section>

        <section class="lg:col-span-2 space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                <h2 class="text-lg font-black text-gray-200 uppercase tracking-wide" id="active-region-title">Cargando...</h2>
                <span class="text-xs font-medium text-gray-500 bg-gray-900 border border-gray-800 px-3 py-1 rounded-full" id="region-count">0 restantes</span>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="pokemon-grid"></div>
        </section>

    </main>

    <script>
        // Lista Maestra enlazada a datos públicos de la comunidad PokeMMO
        let pokemonDB = [];
        const regions = ["Kanto", "Johto", "Hoenn", "Sinnoh", "Unova"];
        let currentRegion = "Kanto";
        let capturedPokemon = JSON.parse(localStorage.getItem('pokemmo_captured')) || [];

        const regionButtonsContainer = document.getElementById('region-buttons');
        const pokemonGrid = document.getElementById('pokemon-grid');
        const activeRegionTitle = document.getElementById('active-region-title');
        const regionCount = document.getElementById('region-count');
        const globalProgress = document.getElementById('global-progress');
        const searchBar = document.getElementById('search-bar');
        const btnCalcRoute = document.getElementById('btn-calc-route');
        const routeResult = document.getElementById('route-result');

        // Cargamos los más de 600 Pokémon organizados por las 5 regiones desde el repositorio oficial de PokeMMO Tools
        async function loadPokeMMOData() {
            try {
                activeRegionTitle.textContent = "Cargando base de datos...";
                // Petición a la base de datos mapeada de la Pokédex Gen 1-5 de PokeMMO
                const response = await fetch('https://githubusercontent.com');
                const data = await response.json();
                
                // Formateamos y limpiamos las rutas y regiones nativas de PokeMMO
                pokemonDB = data.filter(p => p.id <= 649).map(p => {
                    // Mapeo inteligente de regiones basado en su ID nativo
                    let reg = "Kanto";
                    if (p.id >= 152 && p.id <= 251) reg = "Johto";
                    else if (p.id >= 252 && p.id <= 386) reg = "Hoenn";
                    else if (p.id >= 387 && p.id <= 493) reg = "Sinnoh";
                    else if (p.id >= 494) reg = "Unova";

                    // Asignamos locaciones por defecto basadas en las guías si el json viene vacío
                    let locs = p.locations || [];
                    if (locs.length === 0) {
                        locs = [`Ruta propia de la región ${reg}`, `Hierba Alta de ${reg}`];
                    }

                    return {
                        id: p.id,
                        name: p.name.eng || p.name,
                        region: reg,
                        locations: locs
                    };
                });

                initRegions();
                renderPokemon();
            } catch (error) {
                activeRegionTitle.textContent = "Error al cargar los datos. Reintenta.";
                console.error(error);
            }
        }

        function initRegions() {
            regionButtonsContainer.innerHTML = '';
            regions.forEach(reg => {
                const btn = document.createElement('button');
                btn.textContent = reg;
                btn.className = `px-3 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider border transition-all cursor-pointer ${
                    currentRegion === reg 
                    ? 'bg-red-500 border-red-500 text-gray-950 font-black shadow-lg shadow-red-500/20' 
                    : 'bg-gray-950 border-gray-800 hover:border-gray-700 text-gray-400'
                }`;
                btn.onclick = () => {
                    currentRegion = reg;
                    initRegions();
                    renderPokemon();
                    routeResult.classList.add('hidden');
                };
                regionButtonsContainer.appendChild(btn);
            });
        }

        function renderPokemon() {
            const query = searchBar.value.toLowerCase();
            pokemonGrid.innerHTML = '';
            activeRegionTitle.textContent = currentRegion;

            const filtered = pokemonDB.filter(p => p.region === currentRegion && p.name.toLowerCase().includes(query));
            const totalInRegion = pokemonDB.filter(p => p.region === currentRegion).length;
            const capturedInRegion = pokemonDB.filter(p => p.region === currentRegion && capturedPokemon.includes(p.id)).length;
            
            regionCount.textContent = `${totalInRegion - capturedInRegion} restantes`;
            globalProgress.textContent = `${capturedPokemon.length} / ${pokemonDB.length}`;

            if(filtered.length === 0) {
                pokemonGrid.innerHTML = `<div class="col-span-full text-center text-sm py-8 text-gray-500">Ningún pokémon coincide.</div>`;
                return;
            }

            filtered.forEach(p => {
                const isCaptured = capturedPokemon.includes(p.id);
                const card = document.createElement('div');
                card.className = `pokemon-card bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col justify-between transition-all cursor-pointer select-none hover:border-gray-700 ${isCaptured ? 'captured' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <div class="text-xs font-mono text-gray-500 mb-1">#${String(p.id).padStart(3, '0')}</div>
                        <div class="font-extrabold text-gray-200 text-base tracking-wide">${p.name}</div>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-[10px] text-gray-400 bg-gray-950 px-2 py-0.5 rounded border border-gray-800 max-w-[75%] truncate" title="${p.locations.join(', ')}">
                            ${p.locations[0]}
                        </span>
                        <div class="w-5 h-5 rounded-full border-2 ${isCaptured ? 'bg-emerald-500 border-emerald-500' : 'border-gray-700'} flex items-center justify-center transition-colors">
                            ${isCaptured ? '✓' : ''}
